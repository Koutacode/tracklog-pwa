name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Supabase Edge Functions
        run: >-
          npx --yes deno check --node-modules-dir=none --no-lock
          supabase/functions/tracklog-privileged/index.ts
          supabase/functions/tracklog-sync/index.ts
          supabase/functions/tracklog-ic-resolver/index.ts
          supabase/functions/tracklog-location/index.ts
      - run: npm run typecheck
      - run: npm run test:ic-catalog
      - run: npm run test:logic
      - run: npm run test:sync
      - run: npm run test:release-apk
      - name: Verify Cloud setup safeguards without network or installations
        run: bash scripts/test-setup-tracklog-cloud.sh
      - run: npm run check:csp
      - run: npm run build
      - run: npm run check:offline

  android-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Verify the Cloud toolchain preflight with the provisioned JDK and SDK
        run: bash scripts/setup-tracklog-cloud.sh --check
      - run: npm run build
      - run: npm run cap:sync:android
      - name: Compile Android and run local unit tests without production configuration
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug

  temporary-workspaces:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify temporary workspace safety in PowerShell 7
        shell: pwsh
        run: ./scripts/test-tracklog-temporary-workspace.ps1
      - name: Verify temporary workspace safety in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-tracklog-temporary-workspace.ps1
