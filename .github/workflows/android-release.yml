name: Android Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 のようなタグがプッシュされたら実行

concurrency:
  group: tracklog-android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリース作成に必要
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase Edge Functions
        run: >-
          npx --yes deno check --node-modules-dir=auto --no-lock
          supabase/functions/tracklog-privileged/index.ts
          supabase/functions/tracklog-sync/index.ts
          supabase/functions/tracklog-ic-resolver/index.ts
          supabase/functions/tracklog-location/index.ts

      - name: Validate release version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = require('./package.json');
          const expectedTag = `v${pkg.version}`;
          const actualTag = process.env.GITHUB_REF_NAME;
          if (actualTag !== expectedTag) {
            throw new Error(`Tag ${actualTag} does not match package.json version ${pkg.version}`);
          }
          const gradleProps = fs.readFileSync('android/gradle.properties', 'utf8');
          const versionName = gradleProps.match(/^tracklogVersionName=(.+)$/m)?.[1]?.trim();
          const versionCode = Number(gradleProps.match(/^tracklogVersionCode=(.+)$/m)?.[1]?.trim());
          if (versionName !== pkg.version) {
            throw new Error(`Android versionName ${versionName} does not match package.json version ${pkg.version}`);
          }
          if (!Number.isSafeInteger(versionCode) || versionCode <= 0) {
            throw new Error(`Android versionCode is invalid: ${versionCode}`);
          }
          const tags = execFileSync('git', ['tag', '--sort=-v:refname'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .map(value => value.trim())
            .filter(Boolean);
          const previousTag = tags.find(value => value !== actualTag);
          if (previousTag) {
            const previousProps = execFileSync('git', ['show', `${previousTag}:android/gradle.properties`], { encoding: 'utf8' });
            const previousCode = Number(previousProps.match(/^tracklogVersionCode=(.+)$/m)?.[1]?.trim());
            if (Number.isSafeInteger(previousCode) && versionCode <= previousCode) {
              throw new Error(`Android versionCode ${versionCode} must be greater than ${previousTag} (${previousCode})`);
            }
          }
          console.log(`Release version OK: ${actualTag}`);
          NODE

      - name: Validate Supabase build config
        shell: bash
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are required for release builds."
            exit 1
          fi

      - name: Configure native push build flag
        shell: bash
        env:
          TRACKLOG_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.TRACKLOG_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${TRACKLOG_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "VITE_TRACKLOG_NATIVE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
            echo "Native FCM registration enabled for this build."
          else
            echo "VITE_TRACKLOG_NATIVE_PUSH_ENABLED=false" >> "$GITHUB_ENV"
            echo "Native FCM registration disabled because Firebase Android config is not set."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Logic tests
        run: npm run test:logic

      - name: Sync protocol integration tests
        run: npm run test:sync

      - name: Check Content Security Policy
        run: npm run check:csp

      - name: Build Web Asset
        run: npm run build

      - name: Verify Offline PWA Assets
        run: npm run check:offline

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Firebase Android config
        env:
          TRACKLOG_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.TRACKLOG_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${TRACKLOG_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$TRACKLOG_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase Android config restored."
          else
            echo "TRACKLOG_GOOGLE_SERVICES_JSON_BASE64 is not set. FCM token registration will be unavailable in this APK."
          fi

      - name: Restore TrackLog Android debug keystore
        env:
          TRACKLOG_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.TRACKLOG_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${TRACKLOG_ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::TRACKLOG_ANDROID_DEBUG_KEYSTORE_BASE64 is required for stable APK updates."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$TRACKLOG_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256'

      - name: Build Android APK
        env:
          TRACKLOG_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tracklog-debug.keystore
        run: |
          cp "$HOME/.android/debug.keystore" "$TRACKLOG_ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android build failed after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::Android build attempt ${attempt}/3 failed; retrying after a backoff."
            sleep $((attempt * 20))
          done

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk tracklog-assist-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging tracklog-assist-debug.apk | head -n 1)"
          EXPECTED_CODE="$(sed -n 's/^tracklogVersionCode=//p' android/gradle.properties | tr -d '\r')"
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.tracklog.assist'"
          echo "$BADGING" | grep "versionCode='$EXPECTED_CODE'"
          echo "$BADGING" | grep "versionName='${GITHUB_REF_NAME#v}'"
          sha256sum tracklog-assist-debug.apk | tee tracklog-assist-debug.apk.sha256

      - name: Verify release APK signer
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_SIGNER_SHA256="14121cbf70043af3bd2fe17dd57833ed51b7f5dbf326459dde6b830f07cbb99c"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          if ! signer_output="$("$APKSIGNER" verify --print-certs tracklog-assist-debug.apk 2>&1)"; then
            echo "::error::The release APK signature could not be verified."
            printf '%s\n' "$signer_output"
            exit 1
          fi
          mapfile -t signer_digests < <(
            printf '%s\n' "$signer_output" |
              grep -Eio '[0-9a-f]{64}' |
              tr '[:upper:]' '[:lower:]'
          )
          if [ "${#signer_digests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK signer, found ${#signer_digests[@]}."
            printf '%s\n' "$signer_output"
            exit 1
          fi
          actual_signer_sha256="${signer_digests[0]}"
          if [ "$actual_signer_sha256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK signer SHA-256 does not match the official TrackLog signer."
            echo "Expected: $EXPECTED_SIGNER_SHA256"
            echo "Actual:   $actual_signer_sha256"
            exit 1
          fi
          echo "Release APK signer verified: $actual_signer_sha256"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tracklog-assist-debug.apk
            tracklog-assist-debug.apk.sha256
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify draft release APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id")"; then
            echo "::error::Could not resolve the draft release ID."
            exit 1
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected exactly one numeric release ID for ${GITHUB_REF_NAME}; got: ${release_id:-none}"
            exit 1
          fi
          release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '[.tag_name, .draft] | @tsv')"
          IFS=$'\t' read -r release_tag release_draft <<< "$release_state"
          if [ "$release_tag" != "$GITHUB_REF_NAME" ] || [ "$release_draft" != "true" ]; then
            echo "::error::Release ${release_id} is not the expected ${GITHUB_REF_NAME} draft."
            exit 1
          fi
          echo "TRACKLOG_RELEASE_ID=${release_id}" >> "$GITHUB_ENV"

          mkdir -p verified-draft-release
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern tracklog-assist-debug.apk \
            --pattern tracklog-assist-debug.apk.sha256 \
            --dir verified-draft-release \
            --clobber
          expected_sha="$(sha256sum tracklog-assist-debug.apk | awk '{print $1}')"
          draft_sha="$(sha256sum verified-draft-release/tracklog-assist-debug.apk | awk '{print $1}')"
          if [ "$draft_sha" != "$expected_sha" ]; then
            echo "::error::Draft release APK does not match the verified build."
            exit 1
          fi
          printf '%s  tracklog-assist-debug.apk\n' "$expected_sha" > verified-draft-release/expected-tracklog-assist-debug.apk.sha256
          if ! cmp --silent \
            verified-draft-release/expected-tracklog-assist-debug.apk.sha256 \
            verified-draft-release/tracklog-assist-debug.apk.sha256; then
            echo "::error::Draft release checksum sidecar is not the exact lowercase SHA-256, two spaces, fixed APK name format."
            exit 1
          fi

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rollback_release_to_draft() {
            local rollback_attempt verify_attempt draft_state
            for rollback_attempt in $(seq 1 6); do
              echo "Rollback attempt ${rollback_attempt}/6: returning release ${TRACKLOG_RELEASE_ID} to draft."
              if gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${TRACKLOG_RELEASE_ID}" \
                -F draft=true >/dev/null; then
                for verify_attempt in $(seq 1 3); do
                  if draft_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${TRACKLOG_RELEASE_ID}" --jq '.draft' 2>/dev/null)" && \
                    [ "$draft_state" = "true" ]; then
                    echo "Rollback verified by release ID: ${GITHUB_REF_NAME} is draft=true."
                    return 0
                  fi
                  sleep 2
                done
              fi
              sleep $((rollback_attempt * 2))
            done
            echo "::error title=CRITICAL RELEASE ROLLBACK FAILED::Release ${TRACKLOG_RELEASE_ID} (${GITHUB_REF_NAME}) could not be returned to a verified draft state after publication failed and may still be public. Immediate manual intervention is required."
            return 1
          }

          if ! gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest; then
            echo "::error::Release publication did not complete cleanly; starting verified rollback in case GitHub accepted the publication."
            if rollback_release_to_draft; then
              echo "::error::Publication failed. ${GITHUB_REF_NAME} was confirmed as draft and was not left public."
              exit 1
            fi
            exit 2
          fi

      - name: Verify latest APK points to this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rollback_release_to_draft() {
            local rollback_attempt verify_attempt draft_state
            for rollback_attempt in $(seq 1 6); do
              echo "Rollback attempt ${rollback_attempt}/6: returning release ${TRACKLOG_RELEASE_ID} to draft."
              if gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${TRACKLOG_RELEASE_ID}" \
                -F draft=true >/dev/null; then
                for verify_attempt in $(seq 1 3); do
                  if draft_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${TRACKLOG_RELEASE_ID}" --jq '.draft' 2>/dev/null)" && \
                    [ "$draft_state" = "true" ]; then
                    echo "Rollback verified by release ID: ${GITHUB_REF_NAME} is draft=true."
                    return 0
                  fi
                  sleep 2
                done
              fi
              sleep $((rollback_attempt * 2))
            done
            echo "::error title=CRITICAL RELEASE ROLLBACK FAILED::Release ${TRACKLOG_RELEASE_ID} (${GITHUB_REF_NAME}) could not be returned to a verified draft state and may still be public. Immediate manual intervention is required."
            return 1
          }

          expected_sha="$(sha256sum tracklog-assist-debug.apk | awk '{print $1}')"
          latest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/tracklog-assist-debug.apk"
          latest_sidecar_url="${latest_url}.sha256"
          printf '%s  tracklog-assist-debug.apk\n' "$expected_sha" > expected-latest-tracklog-assist-debug.apk.sha256
          verified=false
          for attempt in $(seq 1 12); do
            if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
              if [ "$latest_tag" = "$GITHUB_REF_NAME" ]; then
                if curl --fail --location --retry 3 --output latest-tracklog-assist-debug.apk "$latest_url"; then
                  if curl --fail --location --retry 3 --output latest-tracklog-assist-debug.apk.sha256 "$latest_sidecar_url"; then
                    actual_sha="$(sha256sum latest-tracklog-assist-debug.apk | awk '{print $1}')"
                    if [ "$actual_sha" = "$expected_sha" ] && \
                      cmp --silent expected-latest-tracklog-assist-debug.apk.sha256 latest-tracklog-assist-debug.apk.sha256; then
                      verified=true
                      break
                    fi
                  fi
                fi
              fi
            fi
            sleep 5
          done
          if [ "$verified" != true ]; then
            echo "::error::GitHub latest APK or checksum sidecar does not match ${GITHUB_REF_NAME}; starting verified rollback."
            if rollback_release_to_draft; then
              echo "::error::Latest APK verification failed. ${GITHUB_REF_NAME} was returned to draft and was not left public."
              exit 1
            fi
            exit 2
          fi

      - name: Remove APK assets from older releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fetch_old_apk_assets() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name != \"${GITHUB_REF_NAME}\") | .tag_name as \$tag | .assets[]? | select((.name | ascii_downcase | endswith(\".apk\")) or (.name | ascii_downcase | endswith(\".apk.sha256\"))) | [.id, \$tag, .name] | @tsv"
          }

          rollback_release_to_draft() {
            local rollback_attempt verify_attempt draft_state
            for rollback_attempt in $(seq 1 6); do
              echo "Rollback attempt ${rollback_attempt}/6: returning release ${TRACKLOG_RELEASE_ID} to draft."
              if gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${TRACKLOG_RELEASE_ID}" \
                -F draft=true >/dev/null; then
                for verify_attempt in $(seq 1 3); do
                  if draft_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${TRACKLOG_RELEASE_ID}" --jq '.draft' 2>/dev/null)" && \
                    [ "$draft_state" = "true" ]; then
                    echo "Rollback verified by release ID: ${GITHUB_REF_NAME} is draft=true."
                    return 0
                  fi
                  sleep 2
                done
              fi
              sleep $((rollback_attempt * 2))
            done
            echo "::error title=CRITICAL RELEASE ROLLBACK FAILED::Release ${TRACKLOG_RELEASE_ID} (${GITHUB_REF_NAME}) could not be returned to a verified draft state after old-asset cleanup failed and may still be public. Immediate manual intervention is required."
            return 1
          }

          asset_snapshot="$(mktemp)"
          next_snapshot="${asset_snapshot}.next"
          trap 'rm -f "$asset_snapshot" "$next_snapshot"' EXIT
          cleanup_verified=false
          zero_scan_count=0
          remaining="unknown"

          for scan_attempt in $(seq 1 8); do
            echo "Old APK asset scan ${scan_attempt}/8."
            if ! fetch_old_apk_assets > "$next_snapshot"; then
              echo "::warning::Could not enumerate old APK assets on scan ${scan_attempt}/8."
              sleep $((scan_attempt * 2))
              continue
            fi
            mv "$next_snapshot" "$asset_snapshot"
            remaining="$(wc -l < "$asset_snapshot" | tr -d '[:space:]')"

            if [ "$remaining" -eq 0 ]; then
              zero_scan_count=$((zero_scan_count + 1))
              echo "Old APK asset scan is empty (${zero_scan_count}/2 confirmations)."
              if [ "$zero_scan_count" -ge 2 ]; then
                cleanup_verified=true
                break
              fi
              sleep 3
              continue
            fi

            zero_scan_count=0
            echo "Found ${remaining} old APK or checksum assets; deleting by asset ID."
            while IFS=$'\t' read -r asset_id tag asset_name; do
              [ -n "$asset_id" ] || continue
              deleted=false
              for delete_attempt in $(seq 1 4); do
                if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null 2>&1; then
                  echo "Deleted ${tag}/${asset_name}."
                  deleted=true
                  break
                fi
                echo "::warning::Delete attempt ${delete_attempt}/4 failed for ${tag}/${asset_name} (asset ${asset_id})."
                sleep $((delete_attempt * 2))
              done
              if [ "$deleted" != true ]; then
                echo "::warning::Asset ${asset_id} remains pending; a later scan will retry it."
              fi
            done < "$asset_snapshot"
            sleep 4
          done

          if [ "$cleanup_verified" != true ]; then
            echo "::error::Older APK asset cleanup was not confirmed at zero after retries (last observed count: ${remaining})."
            if rollback_release_to_draft; then
              echo "::error::Old APK asset cleanup failed. ${GITHUB_REF_NAME} was returned to draft and was not left public."
              exit 1
            fi
            exit 2
          fi
          echo "Older release APK assets verified at zero after two consecutive scans."
