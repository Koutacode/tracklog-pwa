name: Distribution Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-read-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # No checkout/build/upload. The credential stays inside this Actions step.
      - name: Check stored distribution credential without publishing
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.TRACKLOG_DISTRIBUTION_TOKEN }}
        shell: python
        run: |
          import json, os, sys, urllib.error, urllib.request
          token = os.environ.get('DISTRIBUTION_TOKEN', '')
          if not token:
              print('::error::Distribution credential is not configured.')
              sys.exit(1)
          request = urllib.request.Request(
              'https://api.github.com/repos/Koutacode/tracklog-releases',
              headers={'Authorization': 'Bearer ' + token,
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              print('Distribution repository HTTP 200')
              print('Public repository: ' + str(data.get('private') is False))
              print('Push permission reported: ' + str(data.get('permissions', {}).get('push') is True))
              if data.get('private') is not False or data.get('permissions', {}).get('push') is not True:
                  print('::error::Expected public distribution repository with write permission.')
                  sys.exit(1)
          except urllib.error.HTTPError as error:
              # No response body, headers, token, or exception text is logged.
              print('::error::Distribution repository HTTP ' + str(error.code))
              sys.exit(1)
          except Exception:
              print('::error::Distribution credential request failed; details withheld.')
              sys.exit(1)
